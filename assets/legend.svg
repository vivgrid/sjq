<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 302" width="900" height="302" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace" font-size="12">
<title>Every kind of line sjq prints, in its colors</title>
<style>text{white-space:pre}</style>
<rect x="0.5" y="0.5" width="899" height="301" rx="12" fill="#1a1b26" stroke="#2f334d"/>
<circle cx="26" cy="30" r="4" fill="#7aa2f7"/><text x="38" y="34" fill="#636d97" font-size="11.5">once per stream</text><text x="172" y="34"><tspan fill="#7aa2f7">meta: id=chatcmpl-42 created=1792034296 model=some-model</tspan></text><rect x="1" y="41" width="898" height="22" fill="#ffffff" fill-opacity="0.025"/><circle cx="26" cy="52" r="4" fill="#7dcfff"/><text x="38" y="56" fill="#636d97" font-size="11.5">first delta</text><text x="172" y="56"><tspan fill="#636d97">data:</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#7dcfff">role=assistant</tspan><tspan fill="#c0caf5">, ''</tspan></text><circle cx="26" cy="74" r="4" fill="#636d97"/><text x="38" y="78" fill="#636d97" font-size="11.5">reasoning</text><text x="172" y="78"><tspan fill="#636d97">data:</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#636d97">reasoning_content=' user'</tspan></text><rect x="1" y="85" width="898" height="22" fill="#ffffff" fill-opacity="0.025"/><circle cx="26" cy="96" r="4" fill="#c0caf5"/><text x="38" y="100" fill="#636d97" font-size="11.5">content</text><text x="172" y="100"><tspan fill="#636d97">data:</tspan><tspan fill="#c0caf5"> ' in'</tspan></text><circle cx="26" cy="118" r="4" fill="#c0caf5"/><text x="38" y="122" fill="#636d97" font-size="11.5">escaped newline</text><text x="172" y="122"><tspan fill="#636d97">data:</tspan><tspan fill="#c0caf5"> '\n'</tspan></text><rect x="1" y="129" width="898" height="22" fill="#ffffff" fill-opacity="0.025"/><circle cx="26" cy="140" r="4" fill="#bb9af7"/><text x="38" y="144" fill="#636d97" font-size="11.5">tool call</text><text x="172" y="144"><tspan fill="#636d97">data:</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#bb9af7">tool_calls[0] id=call_1 name=get_weather</tspan></text><circle cx="26" cy="162" r="4" fill="#bb9af7"/><text x="38" y="166" fill="#636d97" font-size="11.5">…its arguments</text><text x="172" y="166"><tspan fill="#636d97">data:</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#bb9af7">tool_calls[0] args='{"city":'</tspan></text><rect x="1" y="173" width="898" height="22" fill="#ffffff" fill-opacity="0.025"/><circle cx="26" cy="184" r="4" fill="#f7768e"/><text x="38" y="188" fill="#636d97" font-size="11.5">refusal</text><text x="172" y="188"><tspan fill="#636d97">data:</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#f7768e">refusal='I can\'t help with that.'</tspan></text><circle cx="26" cy="206" r="4" fill="#c0caf5"/><text x="38" y="210" fill="#636d97" font-size="11.5">passed through</text><text x="172" y="210"><tspan fill="#c0caf5">: ping</tspan></text><rect x="1" y="217" width="898" height="22" fill="#ffffff" fill-opacity="0.025"/><circle cx="26" cy="228" r="4" fill="#e0af68"/><text x="38" y="232" fill="#636d97" font-size="11.5">last chunk</text><text x="172" y="232"><tspan fill="#636d97">data:</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#e0af68">finish_reason=tool_calls</tspan><tspan fill="#c0caf5">, </tspan><tspan fill="#9ece6a">usage: {"prompt_tokens":9,"completion_tokens":44,"total_tokens":53}</tspan></text><circle cx="26" cy="250" r="4" fill="#f7768e"/><text x="38" y="254" fill="#636d97" font-size="11.5">error</text><text x="172" y="254"><tspan fill="#636d97">data:</tspan><tspan fill="#c0caf5"> </tspan><tspan fill="#f7768e">error: {"message":"Rate limit reached","code":429}</tspan></text><rect x="1" y="261" width="898" height="22" fill="#ffffff" fill-opacity="0.025"/><circle cx="26" cy="272" r="4" fill="#c0caf5"/><text x="38" y="276" fill="#636d97" font-size="11.5">the end</text><text x="172" y="276"><tspan fill="#636d97">data:</tspan><tspan fill="#c0caf5"> [DONE]</tspan></text><line x1="158" x2="158" y1="10" y2="292" stroke="#2f334d"/>
</svg>
